server {
    listen 80;
    # Use the server's IP. Replace with a domain name and add a certbot HTTPS block when ready.
    server_name 2.28.124.111 _;

    # SSE connections (the MCP transport the agent uses internally) hold open for minutes.
    # The agent's own chat is also long-polling. Both need timeouts longer than the default 60 s.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Required for SSE: nginx must not buffer the event stream — each chunk has to reach the
    # browser the moment the server writes it, not when nginx decides the buffer is full.
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
